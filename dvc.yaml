stages:
  normalize_pilot:
    cmd: .venv/bin/python bigdata normalize pilot --dataset-dir data/datasets/pilot-v1 --output-dir data/datasets/pilot-v1-normalized/normalized
    deps:
      - bigdata
      - collector/__main__.py
      - collector/npm/collector.py
      - collector/depsdev/collector.py
      - processing/normalization/pipeline.py
      - processing/normalization/version-quality.cjs
      - processing/normalization/package.json
      - processing/normalization/package-lock.json
      - processing/normalization/requirements.txt
      - data/datasets/pilot-v1
    outs:
      - data/datasets/pilot-v1-normalized/normalized
  technical_lag_pilot:
    cmd: .venv/bin/python -m processing.technical_lag pilot --input-dir data/datasets/pilot-v1-normalized/normalized --output-dir data/datasets/pilot-v1-technical-lag/technical_lag
    deps:
      - processing/technical_lag/__main__.py
      - processing/technical_lag/pipeline.py
      - processing/technical_lag/core.cjs
      - processing/technical_lag/runner.cjs
      - processing/technical_lag/package.json
      - processing/technical_lag/package-lock.json
      - processing/technical_lag/requirements.txt
      - data/datasets/pilot-v1-normalized/normalized
    outs:
      - data/datasets/pilot-v1-technical-lag/technical_lag
  security_enrichment_pilot:
    cmd: .venv/bin/python -m processing.security --dataset-dir data/datasets/pilot-v1 --versions-dir data/datasets/pilot-v1-normalized/normalized --output-dir data/datasets/pilot-v1-security/security
    deps:
      - processing/security/__main__.py
      - processing/security/pipeline.py
      - processing/security/requirements.txt
      - data/datasets/pilot-v1
      - data/datasets/pilot-v1-normalized/normalized
    outs:
      - data/datasets/pilot-v1-security/security
  temporal_pilot:
    cmd: .venv/bin/python -m processing.temporal --input-dir data/datasets/pilot-v1-normalized/normalized --output-dir data/datasets/pilot-v1-temporal/temporal
    deps:
      - processing/temporal/__main__.py
      - processing/temporal/pipeline.py
      - processing/temporal/requirements.txt
      - processing/technical_lag/core.cjs
      - processing/technical_lag/runner.cjs
      - data/datasets/pilot-v1-normalized/normalized
    outs:
      - data/datasets/pilot-v1-temporal/temporal
